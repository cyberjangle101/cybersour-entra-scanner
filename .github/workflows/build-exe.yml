name: build-windows-exe
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --noconsole --name EntraPostureScanner-GUI --collect-submodules entra_scan --collect-data certifi entra_posture_gui.py
      - run: pyinstaller --noconfirm --onefile --name EntraPostureScanner-CLI --collect-submodules entra_scan --collect-data certifi entra_posture_scan.py
      - run: dist\EntraPostureScanner-CLI.exe --version
      - run: dist\EntraPostureScanner-CLI.exe --list-permissions
      # Pin this to a commit SHA like the other actions once you have confirmed the one you trust.
      - uses: actions/upload-artifact@v7
        with:
          name: EntraPostureScanner-windows
          path: dist/*.exe
