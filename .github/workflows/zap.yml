name: zap-baseline
on: [workflow_dispatch, pull_request]
permissions: { contents: read }
jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python tools/make_sample_report.py site
      - run: (cd site && python -m http.server 8000 &) ; sleep 2
      - uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with: { target: "http://localhost:8000/index.html", fail_action: true }
